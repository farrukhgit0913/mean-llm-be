<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="MEAN LLM API status dashboard"
  />

  <title>MEAN LLM API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #172033 0%,
          #0b1020 45%,
          #070b14 100%
        );
      color: #f8fafc;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 920px;
    }

    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .header {
      padding: 34px 36px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #86efac;
      font-size: 13px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .content {
      padding: 20px 36px 36px;
    }

    .status-section {
      display: flex;
      justify-content: center;
      padding: 22px 0 34px;
    }

    .gauge {
      position: relative;
      width: 250px;
      height: 250px;
    }

    .gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-track {
      fill: none;
      stroke: rgba(148, 163, 184, 0.1);
      stroke-width: 14;
    }

    .gauge-value {
      fill: none;
      stroke: #22c55e;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 660;
      stroke-dashoffset: 0;
      filter: drop-shadow(
        0 0 10px rgba(34, 197, 94, 0.35)
      );
      animation: gaugeIn 1.2s ease-out;
    }

    @keyframes gaugeIn {
      from {
        stroke-dashoffset: 660;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .gauge-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .gauge-icon {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .gauge-title {
      font-size: 30px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .gauge-label {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric {
      padding: 18px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .metric-label {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .metric-value {
      color: #e2e8f0;
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    .services {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .service-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .service-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.06);
    }

    .service-name {
      font-size: 14px;
      font-weight: 600;
    }

    .service-description {
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
    }

    .service-status {
      color: #86efac;
      font-size: 12px;
      font-weight: 600;
    }

    .links {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .link {
      flex: 1;
      text-decoration: none;
      text-align: center;
      padding: 13px 16px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
    }

    .footer {
      padding: 18px 36px;
      border-top: 1px solid rgba(148, 163, 184, 0.08);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #475569;
      font-size: 12px;
    }

    .footer strong {
      color: #64748b;
    }

    @media (max-width: 700px) {
      .header {
        padding: 25px 22px 15px;
      }

      .content {
        padding: 15px 22px 25px;
      }

      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }

      .services {
        grid-template-columns: 1fr;
      }

      .footer {
        padding: 16px 22px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        border-radius: 22px;
      }

      .header {
        align-items: flex-start;
      }

      .badge {
        font-size: 11px;
        padding: 7px 9px;
      }

      .gauge {
        width: 210px;
        height: 210px;
      }

      .gauge-title {
        font-size: 25px;
      }

      .links {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <header class="header">

        <div class="brand">

          <div class="logo">
            AI
          </div>

          <div>
            <h1>MEAN LLM Server</h1>

            <p class="subtitle">
              OpenAI · RAG · MongoDB API
            </p>
          </div>

        </div>

        <div class="badge">
          <span class="dot"></span>
          API Online
        </div>

      </header>


      <main class="content">

        <section class="status-section">

          <div class="gauge">

            <svg viewBox="0 0 250 250">

              <circle
                class="gauge-track"
                cx="125"
                cy="125"
                r="105"
              />

              <circle
                class="gauge-value"
                cx="125"
                cy="125"
                r="105"
              />

            </svg>

            <div class="gauge-center">

              <div class="gauge-icon">
                ✓
              </div>

              <div class="gauge-title">
                100%
              </div>

              <div class="gauge-label">
                System Operational
              </div>

            </div>

          </div>

        </section>


        <section class="metrics">

          <div class="metric">
            <div class="metric-label">
              Environment
            </div>

            <div
              class="metric-value"
              id="environment"
            >
              Development
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              Node.js
            </div>

            <div
              class="metric-value"
              id="node"
            >
              Loading...
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              Uptime
            </div>

            <div
              class="metric-value"
              id="uptime"
            >
              Loading...
            </div>
          </div>


          <div class="metric">
            <div class="metric-label">
              API Port
            </div>

            <div class="metric-value">
              3000
            </div>
          </div>

        </section>


        <section class="services">

          <div class="service">

            <div class="service-left">

              <div class="service-icon">
                DB
              </div>

              <div>
                <div class="service-name">
                  MongoDB
                </div>

                <div class="service-description">
                  Database service
                </div>
              </div>

            </div>

            <div
              class="service-status"
              id="database-status"
            >
              Checking...
            </div>

          </div>


          <div class="service">

            <div class="service-left">

              <div class="service-icon">
                AI
              </div>

              <div>
                <div class="service-name">
                  OpenAI
                </div>

                <div class="service-description">
                  LLM & embeddings
                </div>
              </div>

            </div>

            <div
              class="service-status"
              id="openai-status"
            >
              Configured
            </div>

          </div>

        </section>


        <section class="links">

          <a
            class="link"
            href="/health"
            target="_blank"
          >
            View Health JSON
          </a>

          <a
            class="link"
            href="/api"
          >
            API
          </a>

        </section>

      </main>


      <footer class="footer">

        <span>
          <strong>MEAN + OpenAI + RAG</strong>
        </span>

        <span id="timestamp">
          Checking status...
        </span>

      </footer>

    </div>

  </div>


  <script>

    function formatUptime(seconds) {

      const days = Math.floor(seconds / 86400);

      seconds %= 86400;

      const hours = Math.floor(seconds / 3600);

      seconds %= 3600;

      const minutes = Math.floor(seconds / 60);

      const secs = seconds % 60;

      const parts = [];

      if (days) {
        parts.push(`${days}d`);
      }

      if (hours) {
        parts.push(`${hours}h`);
      }

      if (minutes) {
        parts.push(`${minutes}m`);
      }

      parts.push(`${secs}s`);

      return parts.join(' ');
    }


    async function loadHealth() {

      try {

        const response = await fetch('/health');

        if (!response.ok) {
          throw new Error('Health check failed');
        }

        const data = await response.json();

        document.getElementById('environment')
          .textContent =
          data.environment ?? 'development';

        document.getElementById('node')
          .textContent =
          data.node ?? 'Unknown';

        document.getElementById('uptime')
          .textContent =
          formatUptime(data.uptime ?? 0);

        document.getElementById('timestamp')
          .textContent =
          `Last checked ${new Date(
            data.timestamp
          ).toLocaleTimeString()}`;

      } catch (error) {

        document.getElementById('uptime')
          .textContent = 'Unavailable';

        document.getElementById('timestamp')
          .textContent = 'Health check failed';

        console.error(error);
      }
    }


    loadHealth();

    setInterval(loadHealth, 5000);

  </script>

</body>
</html>
